# Copy to settings.yaml. Everything here is optional; defaults are shown.
data_dir: data

twitch:
  # Optional. Free at dev.twitch.tv/console. Enables live-status checks and
  # the "viewers made a clip" signal. Chat works without it.
  client_id: ""
  client_secret: ""

scorer:
  bucket_seconds: 5          # chat is grouped into 5s buckets
  baseline_buckets: 120      # 10 minutes of normal chat to compare against
  warmup_buckets: 24         # need 2 minutes of history before firing anything
  threshold: 6.0             # hype score needed to fire a moment (tune this)
  cooldown_seconds: 60       # no second moment from the same channel inside this window
  min_messages: 8            # ignore spikes in tiny chats (fewer msgs than this per bucket)
  chat_lag_seconds: 8        # chat reacts ~8s after the moment; shift timestamp back
  min_hype_z: 2.0            # hype reactions must rise too; pure volume (raids, bots) is ignored
  per_user_cap: 2            # max messages counted per user per bucket (anti-spam)
  score_delay_seconds: 15    # wait this long before scoring so the audio for that moment is in
  weights:
    messages: 1.0
    hype: 1.5
    unique: 1.0
    audio: 1.0               # loudness boost (only for recorded channels, never fires alone)

recorder:
  quality: best              # streamlink quality; "720p60,best" saves bandwidth/disk
  segment_seconds: 10        # buffer file size; clips are cut on these edges
  buffer_minutes: 10         # how much past stream to keep on disk per channel
  pre_roll: 35               # seconds before the moment included in the clip
  post_roll: 20              # seconds after
  clip_retention_days: 3     # delete cut clips from the server after this
  max_concurrent: 20         # recording limit; extra channels stay chat-only
