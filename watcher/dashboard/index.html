<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clip Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky status bar, filter tabs, then a grid of clip cards you work through with the keyboard. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --fg: #171a22; --muted: #5d6475; --line: #dde0e8;
  --accent: #c7771a; --accent-soft: #fbefe0;
  --good: #1f8a4c; --good-soft: #e3f4ea; --bad: #c23a3a; --bad-soft: #fae6e6;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12141a; --surface: #1b1e26; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2c303b;
  --accent: #f0a443; --accent-soft: #3a2b17;
  --good: #4cc27f; --good-soft: #17301f; --bad: #ef6b6b; --bad-soft: #3a1c1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1b1e26; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2c303b;
  --accent: #f0a443; --accent-soft: #3a2b17;
  --good: #4cc27f; --good-soft: #17301f; --bad: #ef6b6b; --bad-soft: #3a1c1c; color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; max-width: 1400px; margin: 0 auto; }
h1 { font: 700 18px var(--font-display); margin: 0; letter-spacing: -0.01em; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
.stats .warn { color: var(--bad); font-weight: 600; }
.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 5px 12px;
  border-radius: 999px; font: 500 13px var(--font-body); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
main { max-width: 1400px; margin: 0 auto; padding-block: 16px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
kbd { font: 12px var(--font-data); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0; }
.card.focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.card.approved { border-color: var(--good); } .card.rejected { opacity: .55; }
video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; max-width: 100%; }
.novideo { aspect-ratio: 16/9; display: grid; place-items: center; color: var(--muted); background: var(--bg); font-size: 13px; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chan { font: 600 15px var(--font-display); overflow-wrap: anywhere; }
.when { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score { font: 700 13px var(--font-data); color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 5px; }
.signals { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 12px var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.signals span b { color: var(--fg); font-weight: 600; }
.badge { font-size: 12px; font-weight: 600; color: var(--good); background: var(--good-soft); padding: 2px 8px; border-radius: 999px; align-self: flex-start; }
.camps { display: flex; flex-wrap: wrap; gap: 5px; }
.camps button { font: 500 12px var(--font-body); border: 1px dashed var(--line); background: transparent; color: var(--muted);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.camps button[aria-pressed="true"] { border-style: solid; border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.actions { display: flex; gap: 8px; }
.actions button { flex: 1; border: 1px solid transparent; border-radius: 7px; padding: 8px; font: 600 13px var(--font-body); cursor: pointer; }
.approve { background: var(--good-soft); color: var(--good); } .approve:hover { border-color: var(--good); }
.reject { background: var(--bad-soft); color: var(--bad); } .reject:hover { border-color: var(--bad); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.state { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; grid-column: 1 / -1; }
#toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; }
details.ch { margin: 0 0 14px; } details.ch summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.chlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; margin-top: 8px; }
.chrow { display: flex; gap: 8px; align-items: center; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.live { background: var(--bad); } .dot.rec { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.chrow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .card { transition: opacity .2s, border-color .2s; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Clip Review</h1>
    <div class="stats" id="stats">Loading…</div>
    <div class="tabs" role="group" aria-label="Filter">
      <button id="tab-new" data-s="new" aria-pressed="true">To review</button>
      <button id="tab-approved" data-s="approved" aria-pressed="false">Approved</button>
      <button id="tab-downloaded" data-s="downloaded" aria-pressed="false">On laptop</button>
      <button id="tab-rejected" data-s="rejected" aria-pressed="false">Rejected</button>
    </div>
  </div>
</header>
<main>
  <details class="ch" id="channels"><summary>Channels</summary><div class="chlist" id="chlist"></div></details>
  <p class="hint"><kbd>J</kbd>/<kbd>K</kbd> next/previous · <kbd>Space</kbd> play from the moment · <kbd>A</kbd> approve · <kbd>R</kbd> reject. Approved clips go to the laptop for every campaign that's highlighted.</p>
  <div class="grid" id="grid"></div>
</main>
<div id="toast" hidden></div>
<script>
let status = "new", moments = [], campaigns = [], focus = 0;
const $ = (id) => document.getElementById(id);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 401) { $("grid").innerHTML = '<p class="empty">Not signed in. Open the link with ?token=… that the watcher printed when it started.</p>'; throw new Error("auth"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => (t.hidden = true), 1800); }
function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(ts * 1000).toLocaleDateString();
}

async function loadHealth() {
  try {
    const h = await api("/api/health");
    const live = h.channels.filter((c) => c.live).length;
    const unknown = h.channels.filter((c) => c.live === null).length;
    $("stats").innerHTML =
      (unknown === h.channels.length
        ? `<span>${plural(h.channels.length, "channel")} · live status unknown (add Twitch keys)</span>`
        : `<span><b>${live}</b> live / ${plural(h.channels.length, "channel")}</span>`) +
      `<span><b>${h.recording}</b>/${h.max_recording} recording</span>` +
      `<span class="${h.low_disk ? "warn" : ""}"><b>${h.disk_free_gb}</b> GB free${h.low_disk ? " · recording paused" : ""}</span>`;
    $("chlist").innerHTML = h.channels.map((c) =>
      `<div class="chrow"><i class="dot ${c.recording ? "rec" : c.live ? "live" : ""}" title="${c.recording ? "recording" : c.live ? "live" : c.live === null ? "unknown" : "offline"}"></i>
       <span><b>${esc(c.channel)}</b> ${c.chat ? "" : "· chat off "}${c.moments_1h ? "· " + plural(c.moments_1h, "moment") + " this hour " : ""}${esc(c.title)}</span></div>`).join("");
  } catch (e) { if (e.message !== "auth") $("stats").textContent = "Server unreachable"; }
}

function card(m, i) {
  const sg = m.signals || {};
  const sig = sg.source === "viewer_clip" ? `<span>found from a viewer clip</span>` :
    [["msgs", sg.messages], ["hype", sg.hype], ["chatters", sg.unique], ["loud", sg.audio_lufs != null ? sg.audio_lufs + " LUFS" : null]]
      .filter(([, v]) => v != null).map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("");
  const video = m.clip_url
    ? `<video preload="metadata" controls playsinline src="${m.clip_url}#t=${Math.max(0, (m.moment_offset || 0) - 5)}"></video>`
    : `<div class="novideo">${status === "new" ? "Clip still cutting, or chat-only channel" : "No clip on server"}</div>`;
  const camps = campaigns.map((c) =>
    `<button data-c="${esc(c.name)}" aria-pressed="${m.campaigns.includes(c.name)}">${esc(c.name)}</button>`).join("");
  const actions = status === "new" || status === "rejected" || status === "approved"
    ? `<div class="actions"><button class="approve" data-act="approved">${status === "approved" ? "Approved ✓" : "Approve"}</button><button class="reject" data-act="rejected">Reject</button></div>`
    : `<div class="state">Downloaded to laptop</div>`;
  return `<article class="card ${m.status} ${i === focus ? "focus" : ""}" data-id="${m.id}" data-i="${i}">${video}
    <div class="body">
      <div class="top"><span class="chan">${esc(m.channel)}</span><span class="when">${ago(m.at)}</span><span class="score">${m.score}</span></div>
      <div class="signals">${sig}</div>
      ${m.viewer_clips ? `<span class="badge">🎬 ${m.viewer_clips} viewer clip${m.viewer_clips > 1 ? "s" : ""}</span>` : ""}
      <div class="camps" aria-label="Campaigns">${camps}</div>
      ${actions}
    </div></article>`;
}
function render() {
  $("grid").innerHTML = moments.length ? moments.map(card).join("")
    : `<p class="empty">${status === "new" ? "Nothing to review. New moments show up here as streams get hype." : "Nothing here yet."}</p>`;
}
async function load() {
  try { moments = await api(`/api/moments?status=${status}&limit=150`); } catch (e) { return; }
  focus = Math.min(focus, Math.max(0, moments.length - 1));
  render();
}
async function setStatus(id, s) {
  const m = moments.find((x) => x.id === id);
  if (s === "approved" && !m.campaigns.length) return toast("Pick at least one campaign first");
  await api(`/api/moments/${id}`, { method: "POST", body: JSON.stringify({ status: s }) });
  toast(s === "approved" ? "Approved: going to the laptop" : "Rejected");
  if (status !== s) { moments = moments.filter((x) => x.id !== id); focus = Math.min(focus, Math.max(0, moments.length - 1)); }
  else m.status = s;
  render();
}
async function toggleCampaign(id, name) {
  const m = moments.find((x) => x.id === id);
  const next = m.campaigns.includes(name) ? m.campaigns.filter((c) => c !== name) : [...m.campaigns, name];
  const upd = await api(`/api/moments/${id}`, { method: "POST", body: JSON.stringify({ campaigns: next }) });
  m.campaigns = upd.campaigns; render();
}

$("grid").addEventListener("click", (e) => {
  const c = e.target.closest(".card"); if (!c) return;
  const id = +c.dataset.id; focus = +c.dataset.i;
  const b = e.target.closest("button");
  if (b?.dataset.act) setStatus(id, b.dataset.act);
  else if (b?.dataset.c) toggleCampaign(id, b.dataset.c);
  else document.querySelectorAll(".card").forEach((el, i) => el.classList.toggle("focus", i === focus));
});
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  status = b.dataset.s; focus = 0;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  load();
}));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey) return;
  const m = moments[focus]; const el = document.querySelector(`.card[data-i="${focus}"]`);
  const move = (d) => { focus = Math.max(0, Math.min(moments.length - 1, focus + d)); render();
    document.querySelector(`.card[data-i="${focus}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" }); };
  if (e.key === "j") move(1);
  else if (e.key === "k") move(-1);
  else if (e.key === "a" && m) setStatus(m.id, "approved");
  else if (e.key === "r" && m) setStatus(m.id, "rejected");
  else if (e.key === " " && el?.querySelector("video")) {
    e.preventDefault(); const v = el.querySelector("video");
    if (v.paused) { v.currentTime = Math.max(0, (m.moment_offset || 0) - 5); v.play(); } else v.pause();
  }
});

(async () => {
  try { campaigns = (await api("/api/campaigns")).filter((c) => c.active); } catch (e) { return; }
  await Promise.all([load(), loadHealth()]);
  setInterval(loadHealth, 20000);
  // pull in new moments without disturbing the card you're on
  setInterval(() => {
    const playing = [...document.querySelectorAll("video")].some((v) => !v.paused);
    if (status === "new" && !playing) load();
  }, 30000);
})();
</script>
</body>
</html>
